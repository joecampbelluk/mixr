<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>mixr 🎨</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #FFF8EE;
    --coral: #FF6B6B;
  }

  html, body {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
    background: var(--cream);
    font-family: 'Nunito', sans-serif;
  }

  #app {
    position: relative;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 16px 16px max(20px, env(safe-area-inset-bottom, 20px));
  }

  #bgCanvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  #title {
    position: relative;
    z-index: 2;
    font-size: clamp(1.6rem, 6vw, 3rem);
    font-weight: 900;
    color: #333;
    letter-spacing: -1px;
    margin-top: 4px;
    /* leave room for the fixed reset button on the right */
    padding-right: clamp(60px, 14vw, 90px);
    width: 100%;
    text-align: center;
  }
  #title span { color: var(--coral); }

  /* Result label — sits above the bowl inside bowl-area */
  #result-label {
    position: absolute;
    top: 6px;
    left: 50%;
    transform: translateX(-50%) scale(0);
    transform-origin: center bottom;
    font-size: clamp(1.2rem, 4.5vw, 2rem);
    font-weight: 900;
    color: #fff;
    background: rgba(0,0,0,0.18);
    padding: 5px 16px;
    border-radius: 999px;
    white-space: nowrap;
    backdrop-filter: blur(4px);
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none;
    z-index: 3;
  }
  #result-label.visible { transform: translateX(-50%) scale(1); }

  #bowl-area {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 1;
    width: 100%;
  }

  #bowlCanvas {
    border-radius: 50%;
    cursor: default;
  }

  #particleCanvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 10;
  }

  #flash {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 9;
    opacity: 0;
    transition: opacity 0.08s ease;
  }

  /* Reset button — fixed top-right */
  #reset-btn {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 100;
    width: clamp(50px, 12vw, 72px);
    height: clamp(50px, 12vw, 72px);
    border-radius: 50%;
    background: var(--coral);
    border: none;
    cursor: pointer;
    box-shadow: 0 5px 18px rgba(255,107,107,0.45);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    -webkit-tap-highlight-color: transparent;
    outline: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #reset-btn svg { width: 52%; height: 52%; pointer-events: none; }
  #reset-btn:active { transform: scale(0.9); box-shadow: 0 3px 10px rgba(255,107,107,0.35); }

  /* Bottom row — full width, just the blob scroller */
  #bottom-row {
    position: relative;
    z-index: 2;
    width: 100%;
  }

  #blob-scroll-wrapper {
    position: relative;
    width: 100%;
  }
  #blob-scroll {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding: 4px 0;
    touch-action: pan-x;
  }
  #blob-scroll::-webkit-scrollbar { display: none; }

  #blob-row {
    display: flex;
    gap: clamp(8px, 2vw, 14px);
    padding: 0 12px;
    width: max-content;
    align-items: center;
  }

  .blob {
    width: clamp(64px, 15vw, 100px);
    height: clamp(64px, 15vw, 100px);
    border-radius: 50%;
    border: none;
    cursor: pointer;
    transition: transform 0.15s ease;
    box-shadow: 0 6px 20px rgba(0,0,0,0.18), inset 0 -4px 8px rgba(0,0,0,0.15), inset 0 4px 8px rgba(255,255,255,0.35);
    outline: none;
    -webkit-tap-highlight-color: transparent;
    flex-shrink: 0;
  }
  .blob:active { transform: scale(0.92); }

  .blob-divider {
    width: 2px;
    height: clamp(44px, 10vw, 68px);
    background: rgba(0,0,0,0.08);
    border-radius: 999px;
    flex-shrink: 0;
  }

  .flying-blob {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 20;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  }

  #bowl-stack {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  #selected-dots {
    display: flex;
    gap: 10px;
    min-height: clamp(18px, 4vw, 28px);
    align-items: center;
    justify-content: center;
  }

  .sel-dot {
    width: clamp(18px, 4vw, 28px);
    height: clamp(18px, 4vw, 28px);
    border-radius: 50%;
    flex-shrink: 0;
    box-shadow: 0 3px 10px rgba(0,0,0,0.25), inset 0 2px 4px rgba(255,255,255,0.3);
    animation: popIn 0.3s cubic-bezier(0.34,1.56,0.64,1) both;
  }

  @keyframes popIn {
    from { transform: scale(0); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="bgCanvas"></canvas>
  <canvas id="particleCanvas"></canvas>
  <div id="flash"></div>

  <div id="title">mix<span>r</span> 🎨</div>

  <div id="bowl-area">
    <div id="bowl-stack">
      <canvas id="bowlCanvas"></canvas>
      <div id="selected-dots"></div>
    </div>
    <div id="result-label"></div>
  </div>

  <div id="bottom-row">
    <div id="blob-scroll-wrapper">
      <div id="blob-scroll">
        <div id="blob-row">
          <!-- generated by JS -->
        </div>
      </div>
    </div>
  </div>
</div>

<button id="reset-btn" aria-label="reset bowl">
  <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
    <path d="M3 3v5h5"/>
  </svg>
</button>

<script>
// ─── ColorEngine ───────────────────────────────────────────────────────────
const COLORS = {
  red:     { r: 230, g:  35, b:  35, name: 'Red' },
  orange:  { r: 255, g: 125, b:   0, name: 'Orange' },
  yellow:  { r: 255, g: 215, b:   0, name: 'Yellow' },
  green:   { r:  50, g: 185, b:  50, name: 'Green' },
  cyan:    { r:   0, g: 195, b: 215, name: 'Cyan' },
  blue:    { r:  35, g:  85, b: 210, name: 'Blue' },
  purple:  { r: 150, g:  50, b: 200, name: 'Purple' },
  magenta: { r: 220, g:  20, b: 145, name: 'Magenta' },
  pink:    { r: 255, g: 100, b: 150, name: 'Pink' },
  brown:   { r: 150, g:  75, b:  25, name: 'Brown' },
  white:   { r: 245, g: 242, b: 238, name: 'White' },
  grey:    { r: 148, g: 144, b: 140, name: 'Grey' },
  black:   { r:  45, g:  38, b:  35, name: 'Black' },
};

const COLOR_GROUPS = [
  ['red', 'orange', 'yellow'],
  ['green', 'cyan', 'blue'],
  ['purple', 'magenta', 'pink'],
  ['brown', 'white', 'grey', 'black'],
];

const MIX_TABLE = {
  // Primary RYB mixes
  'blue+red':       { r: 148, g:  48, b: 200, name: 'Purple!',        emoji: '🍇' },
  'red+yellow':     { r: 255, g: 128, b:   0, name: 'Orange!',        emoji: '🍊' },
  'blue+yellow':    { r:  68, g: 188, b:  68, name: 'Green!',         emoji: '🐸' },
  // Printing Crew / CMY mixes
  'cyan+yellow':    { r:  68, g: 188, b:  68, name: 'Green!',         emoji: '🐸' },
  'cyan+magenta':   { r:  35, g:  85, b: 210, name: 'Blue!',          emoji: '💙' },
  'magenta+yellow': { r: 230, g:  35, b:  35, name: 'Red!',           emoji: '❤️' },
  // Intermediate / rainbow colours
  'blue+purple':    { r: 100, g:  50, b: 215, name: 'Violet!',        emoji: '💜' },
  'green+yellow':   { r: 140, g: 215, b:   0, name: 'Lime!',          emoji: '🍏' },
  // Many Mixes Make Brown
  'blue+orange':    { r: 120, g:  88, b:  52, name: 'Brown!',         emoji: '🟤' },
  'green+red':      { r: 122, g:  88, b:  48, name: 'Brown!',         emoji: '🟤' },
  'purple+yellow':  { r: 138, g:  98, b:  52, name: 'Brown!',         emoji: '🟤' },
  // Tints (colour + white)
  'red+white':      { r: 255, g: 155, b: 155, name: 'Pink!',          emoji: '🌸' },
  'orange+white':   { r: 255, g: 208, b: 170, name: 'Light Orange!',  emoji: '🍊' },
  'white+yellow':   { r: 255, g: 242, b: 145, name: 'Light Yellow!',  emoji: '💛' },
  'green+white':    { r: 175, g: 235, b: 175, name: 'Light Green!',   emoji: '🌿' },
  'blue+white':     { r: 115, g: 175, b: 235, name: 'Sky Blue!',      emoji: '☁️' },
  'cyan+white':     { r: 175, g: 238, b: 245, name: 'Ice Blue!',      emoji: '🧊' },
  'purple+white':   { r: 210, g: 170, b: 235, name: 'Lilac!',         emoji: '🌸' },
  'magenta+white':  { r: 255, g: 175, b: 225, name: 'Orchid!',        emoji: '🌺' },
  'pink+white':     { r: 255, g: 205, b: 225, name: 'Blush!',         emoji: '🌷' },
  'brown+white':    { r: 220, g: 190, b: 160, name: 'Tan!',           emoji: '🏖️' },
  'black+white':    { r: 145, g: 140, b: 135, name: 'Grey!',          emoji: '🌫️' },
  'black+grey':     { r:  85, g:  82, b:  78, name: 'Dark Grey!',     emoji: '🌑' },
  'grey+white':     { r: 205, g: 202, b: 198, name: 'Light Grey!',    emoji: '❄️' },
  // Shades (colour + black)
  'black+red':      { r: 140, g:  20, b:  20, name: 'Dark Red!',      emoji: '🌹' },
  'black+orange':   { r: 140, g:  78, b:  25, name: 'Brown!',         emoji: '🟤' },
  'black+yellow':   { r: 175, g: 145, b:   5, name: 'Dark Yellow!',   emoji: '🌾' },
  'black+green':    { r:  25, g:  95, b:  25, name: 'Dark Green!',    emoji: '🌲' },
  'black+cyan':     { r:   0, g: 105, b: 120, name: 'Teal!',          emoji: '🌊' },
  'black+blue':     { r:  15, g:  50, b: 165, name: 'Deep Blue!',     emoji: '🫐' },
  'black+purple':   { r:  75, g:  20, b: 115, name: 'Dark Purple!',   emoji: '🔮' },
  'black+magenta':  { r: 115, g:  10, b:  80, name: 'Plum!',          emoji: '🍇' },
  'black+pink':     { r: 160, g:  45, b:  90, name: 'Berry!',         emoji: '🍓' },
  'black+brown':    { r:  65, g:  32, b:  10, name: 'Chocolate!',     emoji: '🍫' },
};

const SINGLE_EMOJI = {
  red: '❤️', orange: '🍊', yellow: '💛',
  green: '🌱', cyan: '💎', blue: '💙',
  purple: '🍇', magenta: '🌺', pink: '💗',
  brown: '🟤', white: '🤍', grey: '🌫️', black: '🖤',
};

function colorFamily(name) { return name; }

// Name any RGB colour using HSL classification
function nameColor(r, g, b) {
  const rf = r/255, gf = g/255, bf = b/255;
  const max = Math.max(rf, gf, bf), min = Math.min(rf, gf, bf);
  const l = (max + min) / 2;
  const s = max === min ? 0
    : l > 0.5 ? (max - min) / (2 - max - min)
               : (max - min) / (max + min);

  let h = 0;
  if (max !== min) {
    if (max === rf) h = ((gf - bf) / (max - min) + (gf < bf ? 6 : 0)) * 60;
    else if (max === gf) h = ((bf - rf) / (max - min) + 2) * 60;
    else h = ((rf - gf) / (max - min) + 4) * 60;
  }

  // Achromatic
  if (s < 0.1) {
    if (l > 0.92) return { name: 'White!',      emoji: '🤍' };
    if (l > 0.72) return { name: 'Light Grey!',  emoji: '🌫️' };
    if (l > 0.42) return { name: 'Grey!',         emoji: '🌫️' };
    if (l > 0.18) return { name: 'Dark Grey!',   emoji: '🌑' };
    return             { name: 'Black!',          emoji: '🖤' };
  }

  let prefix = '';
  if (l > 0.72)      prefix = 'Light ';
  else if (l < 0.28) prefix = 'Dark ';
  else if (s < 0.25) prefix = 'Muted ';

  let hue, emoji;
  if      (h < 12  || h >= 348) { hue = 'Red';          emoji = '❤️';  }
  else if (h < 28)               { hue = 'Red Orange';   emoji = '🔶';  }
  else if (h < 50)               { hue = 'Orange';       emoji = '🍊';  }
  else if (h < 68)               { hue = 'Yellow';       emoji = '💛';  }
  else if (h < 100)              { hue = 'Lime';         emoji = '🍏';  }
  else if (h < 155)              { hue = 'Green';        emoji = '🐸';  }
  else if (h < 175)              { hue = 'Teal';         emoji = '🌊';  }
  else if (h < 200)              { hue = 'Cyan';         emoji = '💎';  }
  else if (h < 248)              { hue = 'Blue';         emoji = '💙';  }
  else if (h < 278)              { hue = 'Purple';       emoji = '🍇';  }
  else if (h < 318)              { hue = 'Magenta';      emoji = '💜';  }
  else                           { hue = 'Pink';         emoji = '🌸';  }

  return { name: prefix + hue + '!', emoji };
}

// Kubelka-Munk helpers — must live outside mixColors to avoid parameter name clash with forEach
function kmAbsorb(v) { const n = Math.max(1, v) / 255; return (1 - n) * (1 - n) / (2 * n); }
function kmReflect(k) { return Math.round(Math.max(0, Math.min(255, (1 + k - Math.sqrt(k * k + 2 * k)) * 255))); }

function mixColors(colorNames) {
  const unique = [...new Set(colorNames)];

  if (unique.length === 1) {
    const c = COLORS[unique[0]];
    return { r: c.r, g: c.g, b: c.b, name: c.name + '!', emoji: SINGLE_EMOJI[unique[0]] || '🎨' };
  }

  // Sequential Kubelka-Munk: each new colour mixes 1:1 with the running result
  let { r, g, b } = COLORS[colorNames[0]];
  for (let i = 1; i < colorNames.length; i++) {
    const c = COLORS[colorNames[i]];
    r = kmReflect((kmAbsorb(r) + kmAbsorb(c.r)) / 2);
    g = kmReflect((kmAbsorb(g) + kmAbsorb(c.g)) / 2);
    b = kmReflect((kmAbsorb(b) + kmAbsorb(c.b)) / 2);
  }

  // 3+ primary families → mud
  const families = new Set(unique.map(colorFamily));
  if (['red','yellow','blue'].filter(f => families.has(f)).length >= 3) {
    return { r, g, b, name: 'Brown!', emoji: '🟤' };
  }

  // Exact 1:1 of two original colours → canonical name
  if (colorNames.length === 2 && unique.length === 2) {
    const key = unique.slice().sort().join('+');
    if (MIX_TABLE[key]) return { r, g, b, ...MIX_TABLE[key] };
  }

  // Name the actual resulting colour
  return { r, g, b, ...nameColor(r, g, b) };
}

function rgbStr(r, g, b, a=1) { return `rgba(${r},${g},${b},${a})`; }

function blobGradient(r, g, b) {
  const hi  = `rgb(${Math.min(255,r+70)},${Math.min(255,g+70)},${Math.min(255,b+70)})`;
  const mid = `rgb(${r},${g},${b})`;
  const lo  = `rgb(${Math.max(0,r-55)},${Math.max(0,g-55)},${Math.max(0,b-55)})`;
  return `radial-gradient(circle at 38% 35%, ${hi}, ${mid} 60%, ${lo})`;
}

// ─── SoundEngine ────────────────────────────────────────────────────────────
const SoundEngine = (() => {
  let ctx = null;
  function init() {
    if (ctx) return;
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  function tone(freq, type, dur, vol=0.18, startTime=null) {
    if (!ctx) return;
    const t = startTime ?? ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = type; osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.start(t); osc.stop(t + dur);
  }
  return {
    init,
    bloop()   { init(); tone(520, 'sine', 0.12, 0.16); },
    plop()    { init(); tone(160, 'triangle', 0.22, 0.22); tone(100, 'sine', 0.18, 0.1, ctx?.currentTime + 0.04); },
    shimmer() { init(); if (!ctx) return; [440,554,659,880].forEach((f,i) => tone(f,'sine',0.3,0.12,ctx.currentTime+i*0.08)); },
    fanfare() { init(); if (!ctx) return; [[523,0],[659,0.1],[784,0.2],[1047,0.32]].forEach(([f,d]) => tone(f,'triangle',0.35,0.14,ctx.currentTime+d)); },
    whoosh()  { init(); tone(200, 'sawtooth', 0.5, 0.08); }
  };
})();

// ─── BowlState ──────────────────────────────────────────────────────────────
const BowlState = {
  addedColors: [],
  currentMix: null,
  animState: 'idle',
  swirlProgress: 0,
  drainProgress: 0,
  celebProgress: 0,
  swirlAngle: 0,

  addColor(name) {
    this.addedColors.push(name);
    this.currentMix = mixColors(this.addedColors);
    if (this.addedColors.length >= 2 && this.animState !== 'draining') {
      this.animState = 'swirling';
      this.swirlProgress = 0;
    }
  },

  reset() {
    this.animState = 'draining';
    this.drainProgress = 0;
  },

  onDrainComplete() {
    this.addedColors = [];
    this.currentMix = null;
    this.animState = 'idle';
    this.swirlProgress = 0;
    this.drainProgress = 0;
    this.celebProgress = 0;
    this.swirlAngle = 0;
  }
};

// ─── ParticleSystem ─────────────────────────────────────────────────────────
const ParticleSystem = (() => {
  const particles = [];
  function spawn(x, y, r, g, b, vx, vy, size, life) {
    particles.push({ x, y, r, g, b, vx, vy, size, life, maxLife: life });
  }
  function burst(x, y, r, g, b, count=20) {
    for (let i=0; i<count; i++) {
      const angle = Math.random() * Math.PI * 2, speed = 2 + Math.random() * 5;
      spawn(x, y, r, g, b, Math.cos(angle)*speed, Math.sin(angle)*speed - 1, 4 + Math.random()*8, 35 + Math.random()*20);
    }
  }
  function celebrate(x, y, r, g, b) {
    for (let i=0; i<60; i++) {
      const angle = Math.random() * Math.PI * 2, speed = 3 + Math.random() * 9;
      const cr = i%3===0?255:i%3===1?r:255, cg = i%3===0?215:i%3===1?g:255, cb = i%3===0?0:i%3===1?b:100;
      spawn(x, y, cr, cg, cb, Math.cos(angle)*speed, Math.sin(angle)*speed - 2, 5 + Math.random()*10, 50 + Math.random()*35);
    }
  }
  function update() {
    for (let i = particles.length-1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.18; p.vx *= 0.97; p.life--;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }
  function draw(ctx) {
    particles.forEach(p => {
      const alpha = p.life / p.maxLife;
      ctx.save(); ctx.globalAlpha = alpha;
      ctx.fillStyle = rgbStr(p.r, p.g, p.b);
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    });
  }
  return { burst, celebrate, update, draw };
})();

// ─── AnimationEngine ────────────────────────────────────────────────────────
const bgCanvas      = document.getElementById('bgCanvas');
const bgCtx         = bgCanvas.getContext('2d');
const bowlCanvas    = document.getElementById('bowlCanvas');
const bowlCtx       = bowlCanvas.getContext('2d');
const particleCanvas= document.getElementById('particleCanvas');
const particleCtx   = particleCanvas.getContext('2d');
const flashEl       = document.getElementById('flash');
const resultLabel   = document.getElementById('result-label');

let bowlR = 110;
let bowlCX, bowlCY;

const bubbles = Array.from({length:16}, () => ({
  x: Math.random() * window.innerWidth,
  y: window.innerHeight + Math.random() * window.innerHeight,
  r: 12 + Math.random() * 40,
  speed: 0.2 + Math.random() * 0.5,
  color: ['#E62323','#FF7D00','#FFD700','#32B932','#2355D2','#9632C8'][Math.floor(Math.random()*6)],
  alpha: 0.04 + Math.random() * 0.08,
}));

function drawBg() {
  bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
  bubbles.forEach(b => {
    bgCtx.save(); bgCtx.globalAlpha = b.alpha; bgCtx.fillStyle = b.color;
    bgCtx.beginPath(); bgCtx.arc(b.x, b.y, b.r, 0, Math.PI*2); bgCtx.fill(); bgCtx.restore();
    b.y -= b.speed;
    if (b.y + b.r < 0) { b.y = bgCanvas.height + b.r; b.x = Math.random() * bgCanvas.width; }
  });
}

function drawBowl() {
  const cx = bowlCanvas.width / 2, cy = bowlCanvas.height / 2;
  bowlCtx.clearRect(0, 0, bowlCanvas.width, bowlCanvas.height);
  const state = BowlState, mix = state.currentMix;

  bowlCtx.save();
  bowlCtx.shadowColor = 'rgba(0,0,0,0.18)'; bowlCtx.shadowBlur = 24; bowlCtx.shadowOffsetY = 8;
  bowlCtx.fillStyle = '#F5F0EB';
  bowlCtx.beginPath(); bowlCtx.arc(cx, cy, bowlR, 0, Math.PI*2); bowlCtx.fill();
  bowlCtx.restore();

  const cg = bowlCtx.createRadialGradient(cx-bowlR*0.3, cy-bowlR*0.3, 2, cx, cy, bowlR);
  cg.addColorStop(0, '#FFFFFF'); cg.addColorStop(0.7, '#F0EBE4'); cg.addColorStop(1, '#DDD5CC');
  bowlCtx.fillStyle = cg;
  bowlCtx.beginPath(); bowlCtx.arc(cx, cy, bowlR, 0, Math.PI*2); bowlCtx.fill();

  if (state.animState === 'idle' && mix) {
    bowlCtx.save();
    bowlCtx.beginPath(); bowlCtx.arc(cx, cy, bowlR-6, 0, Math.PI*2); bowlCtx.clip();
    const fg = bowlCtx.createRadialGradient(cx-bowlR*0.25, cy-bowlR*0.25, 2, cx, cy, bowlR);
    fg.addColorStop(0, rgbStr(Math.min(255,mix.r+40), Math.min(255,mix.g+40), Math.min(255,mix.b+40)));
    fg.addColorStop(1, rgbStr(mix.r, mix.g, mix.b));
    bowlCtx.fillStyle = fg;
    bowlCtx.fillRect(0, 0, bowlCanvas.width, bowlCanvas.height);
    bowlCtx.restore();
  }

  if (state.animState === 'swirling') {
    state.swirlProgress = Math.min(1, state.swirlProgress + 0.012);
    state.swirlAngle += 0.07;
    const colors = [...new Set(state.addedColors)], p = state.swirlProgress;
    bowlCtx.save();
    bowlCtx.beginPath(); bowlCtx.arc(cx, cy, bowlR-6, 0, Math.PI*2); bowlCtx.clip();
    if (colors.length >= 1 && mix) {
      colors.forEach((name, i) => {
        const c = COLORS[name], offset = (i/colors.length)*Math.PI*2;
        const arcFrac = Math.max(0.1, 1-p*0.7), r = (bowlR-6)*(1-p*0.4);
        bowlCtx.save();
        bowlCtx.strokeStyle = rgbStr(c.r, c.g, c.b, 0.85);
        bowlCtx.lineWidth = 18+10*(1-p); bowlCtx.lineCap = 'round';
        bowlCtx.beginPath();
        bowlCtx.arc(cx, cy, r*0.55, state.swirlAngle+offset, state.swirlAngle+offset+Math.PI*2*arcFrac);
        bowlCtx.stroke(); bowlCtx.restore();
      });
      if (p > 0.3) {
        const alpha = (p-0.3)/0.7, resultR = (bowlR-6)*Math.min(1, alpha*1.4);
        const grad = bowlCtx.createRadialGradient(cx, cy, 0, cx, cy, resultR);
        grad.addColorStop(0, rgbStr(mix.r, mix.g, mix.b, alpha));
        grad.addColorStop(1, rgbStr(mix.r, mix.g, mix.b, 0));
        bowlCtx.fillStyle = grad;
        bowlCtx.fillRect(0, 0, bowlCanvas.width, bowlCanvas.height);
      }
    }
    bowlCtx.restore();
    if (state.swirlProgress >= 1) {
      state.animState = 'celebrating'; state.celebProgress = 0;
      ParticleSystem.celebrate(bowlCX, bowlCY, mix.r, mix.g, mix.b);
      SoundEngine.fanfare();
      flashEl.style.background = rgbStr(mix.r, mix.g, mix.b);
      flashEl.style.opacity = '0.22';
      setTimeout(() => { flashEl.style.opacity = '0'; }, 120);
      resultLabel.textContent = mix.emoji + ' ' + mix.name;
      resultLabel.classList.add('visible');
    }
  }

  if (state.animState === 'celebrating') {
    state.celebProgress = Math.min(1, state.celebProgress + 0.016);
    if (mix) {
      bowlCtx.save();
      bowlCtx.beginPath(); bowlCtx.arc(cx, cy, bowlR-6, 0, Math.PI*2); bowlCtx.clip();
      const fg = bowlCtx.createRadialGradient(cx-bowlR*0.25, cy-bowlR*0.25, 2, cx, cy, bowlR);
      fg.addColorStop(0, rgbStr(Math.min(255,mix.r+50), Math.min(255,mix.g+50), Math.min(255,mix.b+50)));
      fg.addColorStop(1, rgbStr(mix.r, mix.g, mix.b));
      bowlCtx.fillStyle = fg;
      bowlCtx.fillRect(0, 0, bowlCanvas.width, bowlCanvas.height);
      if (state.celebProgress < 0.6) {
        const ga = (0.6-state.celebProgress)/0.6;
        bowlCtx.restore(); bowlCtx.save();
        bowlCtx.shadowColor = rgbStr(mix.r, mix.g, mix.b, ga); bowlCtx.shadowBlur = 30*ga;
        bowlCtx.strokeStyle = rgbStr(mix.r, mix.g, mix.b, ga*0.6); bowlCtx.lineWidth = 6;
        bowlCtx.beginPath(); bowlCtx.arc(cx, cy, bowlR+2, 0, Math.PI*2); bowlCtx.stroke();
      }
      bowlCtx.restore();
    }
    if (state.celebProgress >= 1) state.animState = 'idle';
  }

  if (state.animState === 'draining') {
    state.drainProgress = Math.min(1, state.drainProgress + 0.018);
    const p = state.drainProgress;
    if (mix) {
      bowlCtx.save();
      bowlCtx.beginPath(); bowlCtx.arc(cx, cy, bowlR-6, 0, Math.PI*2); bowlCtx.clip();
      const rr = (bowlR-6)*(1-p), angle = p*Math.PI*8;
      bowlCtx.strokeStyle = rgbStr(mix.r, mix.g, mix.b, 1-p);
      bowlCtx.lineWidth = 10*(1-p)+2; bowlCtx.lineCap = 'round';
      bowlCtx.beginPath();
      for (let a=0; a < Math.PI*4; a += 0.15) {
        const sr = rr*(1-a/(Math.PI*4)), sx = cx+Math.cos(angle+a)*sr, sy = cy+Math.sin(angle+a)*sr;
        if (a===0) bowlCtx.moveTo(sx,sy); else bowlCtx.lineTo(sx,sy);
      }
      bowlCtx.stroke(); bowlCtx.restore();
    }
    if (state.drainProgress >= 1) { state.onDrainComplete(); resultLabel.classList.remove('visible'); updateSelectedDots(); }
  }

  if (state.animState === 'idle' && !mix) {
    const t = Date.now()/1000, rippleR = bowlR*0.3 + Math.sin(t*1.8)*bowlR*0.06;
    bowlCtx.save(); bowlCtx.strokeStyle = 'rgba(180,165,150,0.25)'; bowlCtx.lineWidth = 2;
    bowlCtx.beginPath(); bowlCtx.arc(cx, cy, rippleR, 0, Math.PI*2); bowlCtx.stroke(); bowlCtx.restore();
  }

  bowlCtx.save();
  bowlCtx.strokeStyle = 'rgba(255,255,255,0.65)'; bowlCtx.lineWidth = 4;
  bowlCtx.beginPath(); bowlCtx.arc(cx-4, cy-4, bowlR-4, Math.PI*1.1, Math.PI*1.7); bowlCtx.stroke();
  bowlCtx.strokeStyle = 'rgba(0,0,0,0.08)'; bowlCtx.lineWidth = 3;
  bowlCtx.beginPath(); bowlCtx.arc(cx+4, cy+4, bowlR-4, Math.PI*0.1, Math.PI*0.7); bowlCtx.stroke();
  bowlCtx.restore();
}

function drawParticles() {
  particleCtx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
  ParticleSystem.update();
  ParticleSystem.draw(particleCtx);
}

// ─── Generate Blobs ──────────────────────────────────────────────────────────
const blobRow = document.getElementById('blob-row');
COLOR_GROUPS.forEach((group, gi) => {
  if (gi > 0) {
    const div = document.createElement('div');
    div.className = 'blob-divider';
    blobRow.appendChild(div);
  }
  group.forEach(colorName => {
    const c = COLORS[colorName];
    const btn = document.createElement('button');
    btn.className = 'blob';
    btn.dataset.color = colorName;
    btn.setAttribute('aria-label', c.name + ' paint');
    btn.style.background = blobGradient(c.r, c.g, c.b);
    if (c.r + c.g + c.b > 680) {
      btn.style.boxShadow = '0 6px 20px rgba(0,0,0,0.14), inset 0 -4px 8px rgba(0,0,0,0.08), inset 0 4px 8px rgba(255,255,255,0.9)';
    }
    blobRow.appendChild(btn);
  });
});

// ─── Blob pulse ──────────────────────────────────────────────────────────────
let pulseT = 0;
const blobEls = Array.from(document.querySelectorAll('.blob'));
function pulseBlobsFrame() {
  pulseT += 0.03;
  blobEls.forEach((b, i) => {
    const scale = 1 + Math.sin(pulseT + i * (Math.PI*2/blobEls.length)) * 0.05;
    b.style.transform = `scale(${scale.toFixed(3)})`;
  });
}

function tick() { drawBg(); pulseBlobsFrame(); drawBowl(); drawParticles(); requestAnimationFrame(tick); }

// ─── FlyAnimation ───────────────────────────────────────────────────────────
function flyBlobToBowl(blobEl, colorName) {
  const blobRect = blobEl.getBoundingClientRect();
  const size = blobRect.width;
  const startX = blobRect.left + size/2, startY = blobRect.top + size/2;
  const endX = bowlCX, endY = bowlCY;
  const c = COLORS[colorName];

  const clone = document.createElement('div');
  clone.className = 'flying-blob';
  clone.style.cssText = `width:${size}px;height:${size}px;left:${startX-size/2}px;top:${startY-size/2}px;background:${blobGradient(c.r,c.g,c.b)}`;
  document.body.appendChild(clone);

  const dur = 380, start = performance.now();
  function frame(now) {
    let t = (now - start) / dur;
    if (t >= 1) {
      document.body.removeChild(clone);
      SoundEngine.plop();
      ParticleSystem.burst(endX, endY, c.r, c.g, c.b, 22);
      BowlState.addColor(colorName);
      updateSelectedDots();
      if (BowlState.addedColors.length === 1) SoundEngine.shimmer();
      return;
    }
    const e = t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
    const cp = { x: (startX+endX)/2, y: Math.min(startY,endY)-80 };
    const x = (1-e)*(1-e)*startX + 2*(1-e)*e*cp.x + e*e*endX;
    const y = (1-e)*(1-e)*startY + 2*(1-e)*e*cp.y + e*e*endY;
    clone.style.left = `${x-size/2}px`;
    clone.style.top  = `${y-size/2}px`;
    clone.style.transform = `scale(${1 + Math.sin(t*Math.PI)*0.3})`;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

// ─── EventHandlers ──────────────────────────────────────────────────────────
const selectedDotsEl = document.getElementById('selected-dots');
const blobScrollWrapper = document.getElementById('blob-scroll-wrapper');

function updateSelectedDots() {
  selectedDotsEl.innerHTML = '';
  BowlState.addedColors.forEach(name => {
    const c = COLORS[name];
    const dot = document.createElement('div');
    dot.className = 'sel-dot';
    dot.style.background = blobGradient(c.r, c.g, c.b);
    if (c.r + c.g + c.b > 680) {
      dot.style.boxShadow = '0 3px 10px rgba(0,0,0,0.15), inset 0 2px 4px rgba(0,0,0,0.08)';
    }
    selectedDotsEl.appendChild(dot);
  });
  blobScrollWrapper.style.display = BowlState.addedColors.length >= 3 ? 'none' : '';
}

// Tap detection via delegation — pointerdown starts tracking, pointerup selects if no drag
let tapBlob = null, tapStartX, tapStartY, tapMoved;
const blobScrollEl = document.getElementById('blob-scroll');

blobScrollEl.addEventListener('pointerdown', e => {
  const blob = e.target.closest('.blob');
  if (!blob) return;
  tapBlob = blob;
  tapStartX = e.clientX;
  tapStartY = e.clientY;
  tapMoved = false;
});

document.addEventListener('pointermove', e => {
  if (!tapBlob) return;
  if (!tapMoved && (Math.abs(e.clientX - tapStartX) > 8 || Math.abs(e.clientY - tapStartY) > 8)) {
    tapMoved = true;
  }
});

document.addEventListener('pointerup', e => {
  if (!tapBlob) return;
  const blob = tapBlob;
  tapBlob = null;
  if (!tapMoved) {
    SoundEngine.bloop();
    flyBlobToBowl(blob, blob.dataset.color);
  }
});

document.addEventListener('pointercancel', () => { tapBlob = null; });

document.getElementById('reset-btn').addEventListener('pointerdown', e => {
  e.preventDefault();
  if (BowlState.animState === 'draining') return;
  if (BowlState.addedColors.length === 0 && BowlState.animState === 'idle') return;
  SoundEngine.whoosh();
  BowlState.reset();
  resultLabel.classList.remove('visible');
});

// ─── Resize ──────────────────────────────────────────────────────────────────
function onResize() {
  bgCanvas.width = window.innerWidth;
  bgCanvas.height = window.innerHeight;
  particleCanvas.width = window.innerWidth;
  particleCanvas.height = window.innerHeight;

  const bowlArea = document.getElementById('bowl-area');
  const rect = bowlArea.getBoundingClientRect();
  const maxR = Math.min(rect.width, rect.height) / 2 - 12;
  bowlR = Math.max(80, Math.min(140, maxR));
  const dim = (bowlR + 6) * 2;
  bowlCanvas.width = dim;
  bowlCanvas.height = dim;
  bowlCX = rect.left + rect.width / 2;
  bowlCY = rect.top + rect.height / 2;
}

window.addEventListener('resize', onResize);
onResize();
tick();
</script>
</body>
